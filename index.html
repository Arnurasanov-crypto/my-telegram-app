<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn Simulator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
font-family: Arial, sans-serif;
background-color: #1c1c1e;
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
margin: 0;
}
.card {
background: #2c2c2e;
padding: 24px;
border-radius: 16px;
text-align: center;
box-shadow: 0 4px 15px rgba(0,0,0,0.5);
width: 80%;
max-width: 320px;
}
.balance {
font-size: 32px;
font-weight: bold;
color: #34c759;
margin: 16px 0;
}
button {
background-color: #007aff;
color: white;
border: none;
padding: 14px 24px;
font-size: 18px;
border-radius: 12px;
cursor: pointer;
width: 100%;
margin-top: 10px;
}
button:active {
transform: scale(0.98);
}
</style>
</head>
<body>

<div class="card">
<h2>Симулятор Заработка</h2>
<div>Ваш баланс:</div>
<div class="balance" id="balance">0 $</div>
<button onclick="mine()">Заработать 10 $</button>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

let currentBalance = 0;

function mine() {
currentBalance += 10;
document.getElementById('balance').innerText = currentBalance + " $";
}
</script>

</body>
</html>
