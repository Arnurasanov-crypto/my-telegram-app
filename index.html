<!-- Карточка баланса -->
<div class="card">
    <div class="balance-title">Ваш баланс</div>
    <div class="balance-amount"><span id="balance">0.00</span> USDT</div>
    <div class="btn-group">
        <button onclick="deposit()">➕ Пополнить</button>
        <button class="withdraw" onclick="withdraw()">➖ Вывести</button>
    </div>
</div>

<!-- Мини-игра: Кости -->
<div class="card">
    <h3>🎲 Игра "Угадай число (>3)"</h3>
    <p>Ставка: 1 USDT. Выигрыш: 2 USDT (если выпадет 4, 5 или 6)</p>
    <div class="dice-result" id="dice">-</div>
    <button class="game" onclick="playDice()">Бросить кость (1 USDT)</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на весь экран

    let userBalance = 10.00; // Временный баланс для теста (позже подтянем с бэкенда)

    function updateUI() {
        document.getElementById('balance').innerText = userBalance.toFixed(2);
    }

    function deposit() {
        tg.sendData(JSON.stringify({ action: "deposit_request" }));
        alert("Инструкция по пополнению отправлена вам в чат с ботом!");
    }

    function withdraw() {
        tg.sendData(JSON.stringify({ action: "withdraw_request" }));
        alert("Запрос на вывод средств отправлен боту!");
    }

    function playDice() {
        if (userBalance < 1) {
            alert("Недостаточно средств на балансе!");
            return;
        }
        userBalance -= 1;
        
        const roll = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice').innerText = roll;

        if (roll > 3) {
            userBalance += 2;
            alert(`Вы выиграли! Выпало ${roll}. +2 USDT`);
        } else {
            alert(`Вы проиграли! Выпало ${roll}.`);
        }
        updateUI();
    }

    updateUI();
</script>
