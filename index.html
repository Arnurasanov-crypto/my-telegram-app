<!-- Карточка Баланса -->
<div class="card">
    <div class="balance-title">Ваш баланс</div>
    <div class="balance-amount"><span id="balance">10.00</span> USDT</div>
    <div class="btn-group">
        <button onclick="deposit()">➕ Пополнить</button>
        <button class="withdraw" onclick="withdraw()">➖ Вывести</button>
    </div>
</div>

<!-- Мини-игра -->
<div class="card">
    <h3 style="margin-top:0;">🎲 Игра "Больше 3"</h3>
    <p style="color:#8e8e93; font-size:14px;">Ставка: 1 USDT. Выигрыш: 2 USDT (если выпадет 4, 5 или 6)</p>
    <div class="dice-box" id="dice">🎲</div>
    <button class="game" onclick="playDice()">Бросить кость (1 USDT)</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let balance = 10.00;

    function updateUI() {
        document.getElementById('balance').innerText = balance.toFixed(2);
    }

    function deposit() {
        tg.sendData(JSON.stringify({ action: "deposit" }));
        tg.close();
    }

    function withdraw() {
        tg.sendData(JSON.stringify({ action: "withdraw" }));
        tg.close();
    }

    function playDice() {
        if (balance < 1) {
            alert("Недостаточно средств!");
            return;
        }
        balance -= 1;
        
        const roll = Math.floor(Math.random() * 6) + 1;
        const diceIcons = ["1️⃣", "2️⃣", "3️⃣", "4️⃣", "5️⃣", "6️⃣"];
        document.getElementById('dice').innerText = diceIcons[roll - 1];

        setTimeout(() => {
            if (roll > 3) {
                balance += 2;
                alert(`🎉 Вы выиграли! Выпало ${roll}. +2 USDT`);
            } else {
                alert(`❌ Проигрыш. Выпало ${roll}.`);
            }
            updateUI();
        }, 100);
    }

    updateUI();
</script>
