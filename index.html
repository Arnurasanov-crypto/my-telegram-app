<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProfitX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 16px;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
        }
        .balance { font-size: 36px; font-weight: bold; color: #4caf50; margin: 10px 0; }
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 14px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; color: #fff; cursor: pointer;
        }
        .btn-deposit { background: #2196f3; }
        .btn-withdraw { background: #f44336; }
        .btn-game { background: #ff9800; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div style="font-size: 14px; color: #aaa;">Ваш баланс</div>
        <div class="balance"><span id="balance">10.00</span> USDT</div>
        <div class="btn-group">
            <button class="btn-deposit" onclick="handleSend('deposit')">➕ Пополнить</button>
            <button class="btn-withdraw" onclick="handleSend('withdraw')">➖ Вывести</button>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0;">🎲 Игра "Больше 3"</h3>
        <p style="font-size: 13px; color: #aaa;">Ставка: 1 USDT | Выигрыш: 2 USDT (при 4, 5, 6)</p>
        <div id="dice" style="font-size: 60px; margin: 15px 0;">🎲</div>
        <button class="btn-game" onclick="playDice()">Бросить кость (1 USDT)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userBalance = 10.00;

        function updateUI() {
            document.getElementById('balance').innerText = userBalance.toFixed(2);
        }

        function handleSend(actionType) {
            try {
                // Пытаемся отправить данные боту
                tg.sendData(JSON.stringify({ action: actionType }));
            } catch (e) {
                alert("Ошибка отправки: убедитесь, что открыли приложение через синюю кнопку меню внизу экрана!");
            }
        }

        function playDice() {
            if (userBalance < 1) {
                alert("Недостаточно средств!");
                return;
            }
            userBalance -= 1;
            
            const roll = Math.floor(Math.random() * 6) + 1;
            const diceIcons = ["1️⃣", "2️⃣", "3️⃣", "4️⃣", "5️⃣", "6️⃣"];
            document.getElementById('dice').innerText = diceIcons[roll - 1];

            setTimeout(() => {
                if (roll > 3) {
                    userBalance += 2;
                    alert(`🎉 Вы выиграли! Выпало ${roll}. +2 USDT`);
                } else {
                    alert(`❌ Проигрыш. Выпало ${roll}.`);
                }
                updateUI();
            }, 150);
        }

        updateUI();
    </script>
</body>
</html>
